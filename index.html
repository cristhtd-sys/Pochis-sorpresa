<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi Pochis 🌷</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Montserrat,sans-serif}
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.9),transparent 35%),
    radial-gradient(circle at 10% 80%,rgba(246,171,190,.35),transparent 32%),
    radial-gradient(circle at 90% 70%,rgba(224,135,160,.25),transparent 30%),
    linear-gradient(145deg,#fff8f8 0%,#f9e0e5 45%,#e8c2ce 100%);
  color:#5b3a3b;
}
.scene{
  position:relative;width:100vw;height:100vh;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
}
.glow{
  position:absolute;width:55vmin;height:55vmin;border-radius:50%;
  background:rgba(255,255,255,.55);filter:blur(45px);
}
.card{
  position:relative;z-index:5;width:min(88vw,650px);padding:45px 35px;
  text-align:center;border:1px solid rgba(126,82,83,.18);
  background:rgba(255,252,250,.72);backdrop-filter:blur(12px);
  border-radius:30px;box-shadow:0 25px 70px rgba(91,58,59,.18);
  transition:all 1s ease;
}
.eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;opacity:.65}
h1{font-family:'Great Vibes',cursive;font-size:clamp(50px,10vw,82px);font-weight:400;margin:10px 0;color:#8b4e55}
.subtitle{font-size:14px;letter-spacing:1px;opacity:.7}
.message{
  opacity:0;transform:translateY(20px);max-height:0;overflow:hidden;
  transition:all 1.3s ease .5s;
}
.message p{font-family:'Great Vibes',cursive;font-size:clamp(30px,6vw,48px);line-height:1.2;margin:18px 0 5px;color:#713f48}
.message small{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.6}
.opened .message{opacity:1;transform:translateY(0);max-height:300px}
.opened .subtitle,.opened .eyebrow{opacity:.35}
button{
  margin-top:25px;border:0;border-radius:999px;padding:14px 28px;
  background:#8b4e55;color:white;font:500 12px Montserrat;letter-spacing:2px;
  cursor:pointer;box-shadow:0 8px 25px rgba(139,78,85,.28);transition:.3s;
}
button:hover{transform:translateY(-2px)}
.opened button{opacity:0;pointer-events:none;height:0;margin:0;padding:0}

.flower{position:absolute;bottom:-90px;left:50%;width:20px;height:20px;transform:translateX(-50%);z-index:3}
.stem{position:absolute;width:3px;height:0;background:#65784f;left:9px;bottom:0;border-radius:4px;transition:height 2.5s ease}
.bloom{position:absolute;bottom:calc(100% - 5px);left:50%;transform:translateX(-50%) scale(.05);width:90px;height:90px;transition:transform 2s cubic-bezier(.2,.8,.2,1)}
.petal{
  position:absolute;width:38px;height:55px;border-radius:70% 70% 45% 45%;
  left:26px;top:18px;background:linear-gradient(145deg,#eaa4aa,#a95361);
  transform-origin:50% 90%;
}
.petal:nth-child(1){transform:rotate(0) translateY(-18px)}
.petal:nth-child(2){transform:rotate(60deg) translateY(-18px)}
.petal:nth-child(3){transform:rotate(120deg) translateY(-18px)}
.petal:nth-child(4){transform:rotate(180deg) translateY(-18px)}
.petal:nth-child(5){transform:rotate(240deg) translateY(-18px)}
.petal:nth-child(6){transform:rotate(300deg) translateY(-18px)}
.center{position:absolute;width:24px;height:24px;background:#e4b76b;border-radius:50%;left:33px;top:33px;box-shadow:0 0 0 5px rgba(228,183,107,.15)}
.opened .stem{height:72vh}
.opened .bloom{transform:translateX(-50%) scale(1)}
.particle{
 position:absolute;width:7px;height:7px;border-radius:50%;background:#c77b83;
 opacity:0;z-index:1;
}
.opened .particle{animation:float 5s ease-in-out infinite}
@keyframes float{
  0%{opacity:0;transform:translate(0,20px) scale(.5)}
  15%{opacity:.8} 100%{opacity:0;transform:translate(var(--x),-85vh) rotate(360deg) scale(1.1)}
}
.leaf{position:absolute;width:28px;height:12px;background:#7d9162;border-radius:100% 0 100% 0;opacity:0;transition:all 1.2s ease}
.opened .leaf{opacity:.8}
.l1{left:calc(50% - 15px);bottom:30%;transform:rotate(25deg)}
.l2{left:calc(50% - 13px);bottom:45%;transform:rotate(155deg)}
.l3{left:calc(50% - 14px);bottom:58%;transform:rotate(25deg)}
.garden{position:absolute;inset:0;z-index:1;pointer-events:none}
.ground{
  position:absolute;left:-5%;right:-5%;bottom:-8%;height:28%;
  background:linear-gradient(to top,rgba(132,91,91,.22),rgba(255,255,255,0));
  border-radius:50% 50% 0 0/30% 30% 0 0;filter:blur(2px);
}
.garden-flower{
  position:absolute;bottom:5%;width:12px;height:0;
  transform-origin:bottom center;
}
.garden-flower::before{
  content:"";position:absolute;bottom:0;left:5px;width:3px;height:0;
  background:#6f8b62;border-radius:4px;transition:height 1.3s ease;
}
.garden-flower i,.garden-flower i::before,.garden-flower i::after{
  position:absolute;width:25px;height:34px;border-radius:70% 70% 45% 45%;
  background:linear-gradient(145deg,#f6b5c1,#bd6377);
}
.garden-flower i{left:-7px;bottom:0;transform:scale(.03);opacity:0;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .5s}
.garden-flower i::before,.garden-flower i::after{content:"";display:block;left:0;top:0}
.garden-flower i::before{transform:rotate(60deg)}
.garden-flower i::after{transform:rotate(-60deg)}
.garden-flower b{
  position:absolute;width:10px;height:10px;border-radius:50%;background:#e6b76d;
  left:1px;bottom:10px;transform:scale(0);transition:transform .6s ease 1s;
}
.gf1{left:7%;transform:scale(.75)} .gf2{left:18%;transform:scale(1.1)}
.gf3{left:31%;transform:scale(.7)} .gf4{left:70%;transform:scale(.9)}
.gf5{left:82%;transform:scale(1.15)} .gf6{left:92%;transform:scale(.7)}
.gf7{left:58%;transform:scale(.65)}
.opened .garden-flower::before{height:24vh}
.opened .garden-flower i{transform:scale(1);opacity:1}
.opened .garden-flower b{transform:scale(1)}
.gf1 i{transition-delay:.15s}.gf2 i{transition-delay:.5s}.gf3 i{transition-delay:.85s}
.gf4 i{transition-delay:1.2s}.gf5 i{transition-delay:1.55s}.gf6 i{transition-delay:1.9s}
.gf7 i{transition-delay:2.25s}
.gf1::before{transition-delay:.15s}.gf2::before{transition-delay:.5s}
.gf3::before{transition-delay:.85s}.gf4::before{transition-delay:1.2s}
.gf5::before{transition-delay:1.55s}.gf6::before{transition-delay:1.9s}
.gf7::before{transition-delay:2.25s}
@media(max-width:500px){.card{padding:35px 22px}.message p{font-size:35px}.garden-flower{bottom:3%}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="glow"></div>
  <div class="garden" aria-hidden="true">
    <div class="ground"></div>
    <div class="garden-flower gf1"><i></i><b></b></div>
    <div class="garden-flower gf2"><i></i><b></b></div>
    <div class="garden-flower gf3"><i></i><b></b></div>
    <div class="garden-flower gf4"><i></i><b></b></div>
    <div class="garden-flower gf5"><i></i><b></b></div>
    <div class="garden-flower gf6"><i></i><b></b></div>
    <div class="garden-flower gf7"><i></i><b></b></div>
  </div>
  <div class="flower">
    <div class="stem"></div>
    <div class="bloom">
      <span class="petal"></span><span class="petal"></span><span class="petal"></span>
      <span class="petal"></span><span class="petal"></span><span class="petal"></span>
      <span class="center"></span>
    </div>
  </div>
  <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div>

  <div class="card" id="card">
    <div class="eyebrow">Una pequeña sorpresa para ti</div>
    <h1>Mi Pochis</h1>
    <div class="subtitle">Toca el botón y deja que florezca nuestro amor</div>
    <div class="message">
      <p>Feliz día del amor y amistad para mi Pochis.<br>
      Te amo eternamente, mi Pochis.<br>
      Serás mi eterno amor y amistad.<br>
      Te amo, mi vida. ❤️</p>
      <small>Siempre tú · Siempre nosotros</small>
    </div>
    <button id="open">ABRIR MI SORPRESA ✨</button>
     <button id="again" type="button" style="display:none;margin-top:12px;background:transparent;color:#8b4e55;border:1px solid rgba(139,78,85,.35);box-shadow:none;">VOLVER A VER 🌷</button>
  </div>
</div>

<script>
const scene=document.getElementById('scene');
const card=document.getElementById('card');
const again=document.getElementById('again');
document.getElementById('open').addEventListener('click',()=>{
  card.classList.add('opened');
  for(let i=0;i<35;i++){
    const p=document.createElement('span');
    p.className='particle';
    p.style.left=Math.random()*100+'vw';
    p.style.bottom=(Math.random()*25)+'vh';
    p.style.setProperty('--x',(Math.random()*240-120)+'px');
    p.style.animationDelay=(Math.random()*2)+'s';
    p.style.animationDuration=(4+Math.random()*4)+'s';
    scene.appendChild(p);
  }
});
again.addEventListener('click',()=>{
  card.classList.remove('opened');
  again.style.display='none';
  document.querySelectorAll('.particle').forEach(p=>p.remove());
});
</script>
</body>
</html>
