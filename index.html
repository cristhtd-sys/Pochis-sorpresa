<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi Pochis 🌷</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Montserrat,sans-serif}
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.9),transparent 35%),
    radial-gradient(circle at 10% 80%,rgba(246,171,190,.35),transparent 32%),
    radial-gradient(circle at 90% 70%,rgba(224,135,160,.25),transparent 30%),
    linear-gradient(145deg,#fff8f8 0%,#f9e0e5 45%,#e8c2ce 100%);
  color:#5b3a3b;
}
.scene{
  position:relative;width:100vw;height:100vh;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
}
.glow{
  position:absolute;width:55vmin;height:55vmin;border-radius:50%;
  background:rgba(255,255,255,.55);filter:blur(45px);
}
.card{
  position:relative;z-index:5;width:min(88vw,650px);padding:45px 35px;
  text-align:center;border:1px solid rgba(126,82,83,.18);
  background:rgba(255,252,250,.72);backdrop-filter:blur(12px);
  border-radius:30px;box-shadow:0 25px 70px rgba(91,58,59,.18);
  transition:all 1s ease;
}
.eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;opacity:.65}
h1{font-family:'Great Vibes',cursive;font-size:clamp(50px,10vw,82px);font-weight:400;margin:10px 0;color:#8b4e55}
.subtitle{font-size:14px;letter-spacing:1px;opacity:.7}
.message{
  opacity:0;transform:translateY(20px);max-height:0;overflow:hidden;
  transition:all 1.3s ease .5s;
}
.message p{font-family:'Great Vibes',cursive;font-size:clamp(30px,6vw,48px);line-height:1.2;margin:18px 0 5px;color:#713f48}
.message small{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.6}
.opened .message{opacity:1;transform:translateY(0);max-height:300px}
.opened .subtitle,.opened .eyebrow{opacity:.35}
button{
  margin-top:25px;border:0;border-radius:999px;padding:14px 28px;
  background:#8b4e55;color:white;font:500 12px Montserrat;letter-spacing:2px;
  cursor:pointer;box-shadow:0 8px 25px rgba(139,78,85,.28);transition:.3s;
}
button:hover{transform:translateY(-2px)}
.opened button{opacity:0;pointer-events:none;height:0;margin:0;padding:0}


/* ===== RAMO INTERACTIVO ===== */
.bouquet{
  position:absolute; left:50%; bottom:-30px; width:min(520px,82vw); height:78vh;
  transform:translateX(-50%); z-index:3; pointer-events:none;
}
.bouquet-stems{position:absolute; inset:0}
.bstem{
  position:absolute; left:50%; bottom:0; width:4px; height:0;
  background:linear-gradient(to top,#536743,#78905d);
  border-radius:8px; transform-origin:bottom center;
  transition:height 2.1s cubic-bezier(.2,.8,.2,1);
}
.bstem:nth-child(1){transform:rotate(-31deg)}
.bstem:nth-child(2){transform:rotate(-19deg)}
.bstem:nth-child(3){transform:rotate(-8deg)}
.bstem:nth-child(4){transform:rotate(7deg)}
.bstem:nth-child(5){transform:rotate(19deg)}
.bstem:nth-child(6){transform:rotate(31deg)}
.bstem:nth-child(7){transform:rotate(-13deg)}
.bstem:nth-child(8){transform:rotate(14deg)}

.rose{
  position:absolute; left:50%; bottom:0; width:92px; height:105px;
  transform:translate(-50%,25px) scale(.02); opacity:0;
  transition:transform 1.25s cubic-bezier(.16,1,.3,1),opacity .5s;
  transform-origin:bottom center;
}
.rose.r1{bottom:48%;left:23%;transform:rotate(-20deg) translateY(20px) scale(.02)}
.rose.r2{bottom:58%;left:37%;transform:rotate(-10deg) translateY(20px) scale(.02)}
.rose.r3{bottom:66%;left:50%;transform:translate(-50%,20px) scale(.02)}
.rose.r4{bottom:58%;left:63%;transform:rotate(10deg) translateY(20px) scale(.02)}
.rose.r5{bottom:48%;left:77%;transform:rotate(20deg) translateY(20px) scale(.02)}
.rose.r6{bottom:43%;left:40%;transform:rotate(-13deg) translateY(20px) scale(.02)}
.rose.r7{bottom:43%;left:60%;transform:rotate(13deg) translateY(20px) scale(.02)}

.petal{
  position:absolute;left:50%;top:8px;width:40px;height:56px;
  border-radius:70% 70% 48% 48%;
  transform-origin:50% 88%;
  box-shadow:inset -5px -7px 10px rgba(0,0,0,.16), inset 3px 3px 8px rgba(255,255,255,.25);
}
.petal:nth-child(1){transform:translateX(-50%) rotate(0deg) translateY(-9px)}
.petal:nth-child(2){transform:translateX(-50%) rotate(60deg) translateY(-9px)}
.petal:nth-child(3){transform:translateX(-50%) rotate(120deg) translateY(-9px)}
.petal:nth-child(4){transform:translateX(-50%) rotate(180deg) translateY(-9px)}
.petal:nth-child(5){transform:translateX(-50%) rotate(240deg) translateY(-9px)}
.petal:nth-child(6){transform:translateX(-50%) rotate(300deg) translateY(-9px)}
.petal:nth-child(7){width:28px;height:38px;top:18px;transform:translateX(-50%) rotate(30deg) translateY(-6px)}
.petal:nth-child(8){width:28px;height:38px;top:18px;transform:translateX(-50%) rotate(150deg) translateY(-6px)}
.rose-pink .petal{background:linear-gradient(145deg,#ffb5c6,#c85c78)}
.rose-red .petal{background:linear-gradient(145deg,#ed6876,#790e24)}
.rose-black .petal{background:linear-gradient(145deg,#4b3b43,#08070a)}
.rose-center{
  position:absolute;left:50%;top:35px;width:18px;height:18px;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f3d18a,#b27a31 60%,#69461d);
  box-shadow:0 0 0 4px rgba(225,181,102,.14);
}
.leaf{
  position:absolute;width:34px;height:15px;background:linear-gradient(135deg,#7f9668,#40583d);
  border-radius:100% 0 100% 0;opacity:0;transform-origin:0 50%;
  transition:opacity 1s,transform 1s;
}
.leaf.a{left:25%;bottom:31%;transform:rotate(22deg) scale(.2)}
.leaf.b{left:39%;bottom:39%;transform:rotate(155deg) scale(.2)}
.leaf.c{left:59%;bottom:38%;transform:rotate(25deg) scale(.2)}
.leaf.d{left:74%;bottom:30%;transform:rotate(155deg) scale(.2)}

.opened .bstem{height:58vh}
.opened .rose{opacity:1}
.opened .rose.r1{transform:rotate(-20deg) translateY(0) scale(.72);transition-delay:.15s}
.opened .rose.r2{transform:rotate(-10deg) translateY(0) scale(.78);transition-delay:.35s}
.opened .rose.r3{transform:translate(-50%,0) scale(.9);transition-delay:.55s}
.opened .rose.r4{transform:rotate(10deg) translateY(0) scale(.78);transition-delay:.75s}
.opened .rose.r5{transform:rotate(20deg) translateY(0) scale(.72);transition-delay:.95s}
.opened .rose.r6{transform:rotate(-13deg) translateY(0) scale(.68);transition-delay:1.15s}
.opened .rose.r7{transform:rotate(13deg) translateY(0) scale(.68);transition-delay:1.35s}
.opened .leaf{opacity:.9;transform:rotate(22deg) scale(1)}
.opened .leaf.b,.opened .leaf.d{transform:rotate(155deg) scale(1)}

.sparkle{
  position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;
  box-shadow:0 0 14px 4px rgba(255,255,255,.8);
  opacity:0;z-index:4;
}
.opened .sparkle{animation:sparkle 2.8s ease-in-out infinite}
@keyframes sparkle{
  0%,100%{opacity:0;transform:scale(.2) translateY(8px)}
  35%{opacity:1;transform:scale(1)}
  70%{opacity:.25;transform:scale(.5) translateY(-20px)}
}
.particle{
 position:absolute;width:7px;height:7px;border-radius:50%;
 background:#c77b83;opacity:0;z-index:1;
}
.opened .particle{animation:float 5s ease-in-out infinite}
@keyframes float{
  0%{opacity:0;transform:translate(0,20px) scale(.5)}
  15%{opacity:.8}
  100%{opacity:0;transform:translate(var(--x),-85vh) rotate(360deg) scale(1.1)}
}

@media(max-width:500px){
  .card{padding:35px 22px}
  .message p{font-size:35px}
  .bouquet{height:68vh;width:100vw}
  .opened .bstem{height:50vh}
  .rose.r1{left:20%}.rose.r5{left:80%}
}
@media(max-width:500px){.card{padding:35px 22px}.message p{font-size:35px}.garden-flower{bottom:3%}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="glow"></div>
  <div class="garden" aria-hidden="true">
    <div class="ground"></div>
    <div class="garden-flower gf1"><i></i><b></b></div>
    <div class="garden-flower gf2"><i></i><b></b></div>
    <div class="garden-flower gf3"><i></i><b></b></div>
    <div class="garden-flower gf4"><i></i><b></b></div>
    <div class="garden-flower gf5"><i></i><b></b></div>
    <div class="garden-flower gf6"><i></i><b></b></div>
    <div class="garden-flower gf7"><i></i><b></b></div>
  </div>
  <div class="bouquet" aria-hidden="true">
    <div class="bouquet-stems">
      <span class="bstem"></span><span class="bstem"></span><span class="bstem"></span><span class="bstem"></span>
      <span class="bstem"></span><span class="bstem"></span><span class="bstem"></span><span class="bstem"></span>
    </div>
    <div class="rose rose-pink r1"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="rose-center"></span></div>
    <div class="rose rose-red r2"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="rose-center"></span></div>
    <div class="rose rose-black r3"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="rose-center"></span></div>
    <div class="rose rose-pink r4"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="rose-center"></span></div>
    <div class="rose rose-red r5"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="rose-center"></span></div>
    <div class="rose rose-black r6"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="rose-center"></span></div>
    <div class="rose rose-pink r7"><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="rose-center"></span></div>
    <span class="leaf a"></span><span class="leaf b"></span><span class="leaf c"></span><span class="leaf d"></span>
    <i class="sparkle" style="left:22%;bottom:66%;animation-delay:.2s"></i>
    <i class="sparkle" style="left:76%;bottom:63%;animation-delay:1s"></i>
    <i class="sparkle" style="left:51%;bottom:75%;animation-delay:1.7s"></i>
  </div>
  <div class="card" id="card">
    <div class="eyebrow">Una pequeña sorpresa para ti</div>
    <h1>Mi Pochis</h1>
    <div class="subtitle">Toca el botón y deja que florezca nuestro amor</div>
    <div class="message">
      <p>Feliz día del amor y amistad para mi Pochis.<br>
      Te amo eternamente, mi Pochis.<br>
      Serás mi eterno amor y amistad.<br>
      Te amo, mi vida. ❤️</p>
      <small>Siempre tú · Siempre nosotros</small>
    </div>
    <button id="open">ABRIR MI SORPRESA ✨</button>
     <button id="again" type="button" style="display:none;margin-top:12px;background:transparent;color:#8b4e55;border:1px solid rgba(139,78,85,.35);box-shadow:none;">VOLVER A VER 🌷</button>
  </div>
</div>

<script>
const scene=document.getElementById('scene');
const card=document.getElementById('card');
const again=document.getElementById('again');
document.getElementById('open').addEventListener('click',()=>{
  card.classList.add('opened');
  for(let i=0;i<35;i++){
    const p=document.createElement('span');
    p.className='particle';
    p.style.left=Math.random()*100+'vw';
    p.style.bottom=(Math.random()*25)+'vh';
    p.style.setProperty('--x',(Math.random()*240-120)+'px');
    p.style.animationDelay=(Math.random()*2)+'s';
    p.style.animationDuration=(4+Math.random()*4)+'s';
    scene.appendChild(p);
  }
});
again.addEventListener('click',()=>{
  card.classList.remove('opened');
  again.style.display='none';
  document.querySelectorAll('.particle').forEach(p=>p.remove());
});
</script>
</body>
</html>
